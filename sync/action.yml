name: "Merge Mate: Sync"
description: Sync PRs with target branches using rebase or merge strategy
author: GitKraken

branding:
  icon: git-merge
  color: blue

inputs:
  github-token:
    description: GitHub token for authentication
    required: false
  mode:
    description: "rebase or merge"
    required: false
    default: "rebase"
  pr-filter:
    description: "YAML filter for selecting PRs: ids, target-branches, created, updated, authors"
    required: false
  concurrency:
    description: Maximum number of PRs to process in parallel
    required: false
    default: "3"
  apply-policy:
    description: "auto: apply above threshold to PR branch. resolved-only: same as auto but skip clean rebases. hidden-only: always push to hidden ref. dry-run: no push"
    required: false
    default: "auto"
  confidence-threshold:
    description: "Minimum AI confidence (0-100) to auto-apply resolved branches. 100 = only apply when fully confident"
    required: false
    default: "100"
  comment-policy:
    description: "When to post PR comments: none | failed | resolved | conflicts | success | all"
    required: false
    default: "conflicts"
  ai-provider:
    description: "AI provider for conflict resolution: none | gitkraken"
    required: false
    default: "none"
  ai-model:
    description: AI model identifier (provider-specific)
    required: false
  ai-api-key:
    description: API key or token for the AI provider
    required: false
  ai-api-base:
    description: Custom API base URL for the AI provider
    required: false
  exclude-files:
    description: "Newline-separated glob patterns for files to exclude from AI resolution"
    required: false
  diff-viewer-base-url:
    description: Base URL for the diff viewer
    required: false
    default: "https://gitkraken.dev"
  gk-api-base:
    description: GitKraken API base URL for OIDC token exchange
    required: false
  telemetry:
    description: Enable telemetry and error tracking
    required: false
    default: "true"
  log-level:
    description: "error | warn | info | debug"
    required: false
    default: "info"

runs:
  using: node24
  main: ../dist/sync/index.js

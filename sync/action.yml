name: "Merge Mate: Sync"
description: Sync PRs with target branches using rebase or merge strategy
author: GitKraken

branding:
  icon: git-merge
  color: blue

inputs:
  github-token:
    description: GitHub token for authentication
    required: false
  fork-push-token:
    description: Explicit token used only to probe/push fork branches when the primary token cannot access the fork
    required: false
  mode:
    description: "rebase or merge"
    required: false
    default: "rebase"
  signing-mode:
    description: "off | ssh"
    required: false
    default: "off"
  pr-filter:
    description: "YAML filter for selecting PRs: ids, target-branches, labels, created, updated, authors (supports @org/team-slug tokens), include-drafts"

    required: false
  concurrency:
    description: Maximum number of PRs to process in parallel
    required: false
    default: "3"
  apply-policy:
    description: "auto: apply above threshold to PR branch. resolved-only: same as auto but skip clean rebases. review: push to hidden ref for review. dry-run: no push"
    required: false
    default: "auto"
  confidence-threshold:
    description: "Minimum AI confidence (0-100) to auto-apply resolved branches. 100 = only apply when fully confident"
    required: false
    default: "100"
  ai-model:
    description: AI model identifier
    required: false
  ai-api-key:
    description: API key for AI conflict resolution
    required: false
  ai-api-base:
    description: Custom API base URL
    required: false
  exclude-files:
    description: "Newline-separated glob patterns for files to exclude from AI resolution"
    required: false
  diff-viewer-base-url:
    description: Base URL for the diff viewer
    required: false
    default: "https://gitkraken.dev"
  telemetry:
    description: Enable telemetry and error tracking
    required: false
    default: "true"
  log-level:
    description: "error | warn | info | debug"
    required: false
    default: "info"

runs:
  using: node24
  main: ../dist/sync/index.js

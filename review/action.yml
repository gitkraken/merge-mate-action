name: "Merge Mate: Review"
description: Apply or undo resolved changes on PR branches
author: GitKraken

branding:
  icon: git-merge
  color: blue

inputs:
  github-token:
    description: GitHub token for authentication
    required: false
  pr-number:
    description: PR number to process (required for workflow_dispatch)
    required: false
  action:
    description: "'apply' or 'undo' (required for workflow_dispatch)"
    required: false
  gk-api-base:
    description: GitKraken API base URL for OIDC token exchange
    required: false
  telemetry:
    description: Enable telemetry and error tracking
    required: false
    default: "true"
  log-level:
    description: "error | warn | info | debug"
    required: false
    default: "info"

runs:
  using: node24
  main: ../dist/review/index.js

name: "Merge Mate: Review"
description: Apply or undo resolved changes on PR branches
author: GitKraken

branding:
  icon: git-merge
  color: blue

inputs:
  github-token:
    description: GitHub token for authentication
    required: false
  fork-push-token:
    description: Explicit token used only to probe/push fork branches when the primary token cannot access the fork
    required: false
  pr-number:
    description: PR number to process (manual fallback; ignored on repository_dispatch and issue_comment events)
    required: false
  action:
    description: "'apply' or 'undo' (manual fallback; ignored on repository_dispatch and issue_comment events)"
    required: false
  telemetry:
    description: Enable telemetry and error tracking
    required: false
    default: "true"
  diff-viewer-base-url:
    description: Base URL for the diff viewer
    required: false
    default: "https://gitkraken.dev"
  log-level:
    description: "error | warn | info | debug"
    required: false
    default: "info"

runs:
  using: node24
  main: ../dist/review/index.js
